<div class="wrapper content flex flex-col gap-8">
  <!-- Installer Header Info -->
  <mat-card class="installer-header">
    <mat-card-header>
      <div mat-card-avatar class="installer-avatar">
        <mat-icon>person</mat-icon>
      </div>
      <mat-card-title>{{ installer?.name || 'מתקין' }}</mat-card-title>
      <mat-card-subtitle>פרטי מתקין</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="details-grid">
        <div class="info-item">
          <mat-icon class="info-icon">badge</mat-icon>
          <div class="info-content">
            <span class="info-label">שם מתקין</span>
            <span class="info-value">{{ installer?.name || 'לא זמין' }}</span>
          </div>
        </div>
        
        <div class="info-item">
          <mat-icon class="info-icon">phone</mat-icon>
          <div class="info-content">
            <span class="info-label">טלפון</span>
            <span class="info-value">{{ installer?.phone || 'לא זמין' }}</span>
          </div>
        </div>
        
        <div class="info-item" *ngIf="installer?.email">
          <mat-icon class="info-icon">email</mat-icon>
          <div class="info-content">
            <span class="info-label">אימייל</span>
            <span class="info-value">{{ installer?.email }}</span>
          </div>
        </div>
      </div>
      
      <mat-divider *ngIf="installer?.categories && installer?.categories.length > 0"></mat-divider>
      
      <div class="categories-section" *ngIf="installer?.categories && installer?.categories.length > 0">
        <div class="section-header">
          <mat-icon>build_circle</mat-icon>
          <span>קטגוריות התמחות</span>
        </div>
        <div class="categories-list">
          <mat-chip-set>
            <mat-chip *ngFor="let cat of installer?.categories">
              {{ cat?.name }}
            </mat-chip>
          </mat-chip-set>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Action Buttons -->
  <mat-card class="actions-card">
    <mat-card-content>
      <div class="btns-wrapper">
        <button mat-raised-button color="primary" (click)="onCalculations()">
          <mat-icon>calculate</mat-icon>
          התחשבנויות ועבודות
        </button>
        <button mat-raised-button color="primary" (click)="onPrices()">
          <mat-icon>price_check</mat-icon>
          טבלת מחירים
        </button>
        <button mat-raised-button color="accent" (click)="onAddCategories()">
          <mat-icon>category</mat-icon>
          שנה קטגוריות
        </button>
        <button mat-raised-button (click)="onProviderStock()">
          <mat-icon>inventory</mat-icon>
          מלאי ספק
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
